<div class="substitution-filter">
  <loader [display]="isLoading" [size]="'medium'" [relative]="true"></loader>
  <div class="w-sdc-designer-sidebar-section">
    <sdc-accordion [title]="'Substitution Filter Properties'" [arrow-direction]="'right'" [open]="true">
      <div class="i-sdc-designer-sidebar-section-content-substitution-filter-section">

        <div class="i-sdc-designer-sidebar-section-content-substitution-filter"
             [ngClass]="{'hand': !readonly}"
             *ngFor="let property of constraintProperties; let i = index">
          <div class="rule-details" [ngClass]="{'readonly': readonly}">
            <button type="button" class="rule-desc" (click)="!readonly && onSelectSubstitutionFilter(PROPERTIES, i)" [disabled]="readonly"
                 tooltip="{{constraintPropertyLabels[i]}}">
              {{constraintPropertyLabels[i]}}
            </button>
            <button type="button" *ngIf="!readonly" class="sprite-new delete-btn delete-icon"
                  (click)="openDeleteModal(PROPERTIES, i)"
                  data-tests-id="delete-input-button"
                  [attr.aria-label]="('DELETE_LABEL' | translate) + ' ' + constraintPropertyLabels[i]"></button>
          </div>
        </div>

        <div class="w-sdc-designer-sidebar-section-substitution-filter-footer" *ngIf="selectedInstanceProperties?.length">
          <sdc-button [type]="'tertiary'" [icon_name]="'plus'" [icon_position]="'left'" [testId]="'add-substitution-filter-button'"
                      [text]="'ADD_SUBSTITUTION_FILTER' | translate" [disabled]="readonly"
                      (click)="onAddSubstitutionFilter(PROPERTIES)"></sdc-button>
        </div>
        <div class="substitution-filter-no-properties" *ngIf="hasNoProperties()" data-tests-id="substitution-filter-no-properties">
          <p class="substitution-filter-no-properties-title">{{'SUBSTITUTION_FILTER_NO_PROPERTIES' | translate}}</p>
          <button type="button" class="substitution-filter-no-properties-link"
                  data-tests-id="substitution-filter-go-to-properties"
                  (click)="goToPropertiesAssignment()">
            {{'SUBSTITUTION_FILTER_ADD_PROPERTY' | translate}}
          </button>
        </div>
      </div>
    </sdc-accordion>
  </div>
</div>
