<div class="tabs {{tabStyle}}" role="tablist">
<ng-container *ngFor="let tab of tabs">
    <button type="button" class="tab" *ngIf="tab.show" role="tab"
            [attr.id]="tab.tabId" [attr.aria-controls]="tab.panelId"
            [attr.aria-selected]="!!tab.active" [attr.tabindex]="tab.active ? 0 : -1"
            (click)="selectTab(tab)" (keydown)="onTabKeydown($event, tab)"
            [class.active]="tab.active" [attr.data-tests-id]="tab.title" [ngStyle]="{'color': tab.highlight}">
        {{tab.title}}
        <span class="tab-indication" *ngIf="tab.indication" [@indicatorAnimation]="tab.indication">{{tab.indication}}</span>
    </button>
</ng-container>
</div>
<div class="tab-content-container">
    <ng-content></ng-content>
</div>
