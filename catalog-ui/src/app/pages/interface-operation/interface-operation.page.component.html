<!-- This wrapper came from the deleted ui-router state template. .workspace-interface-operation
     (interface-operation.less, imported by app.less) makes it the containing block for the
     <loader [relative]> below; it must NOT offset the tab, which the routed host itself clips. -->
<div class="workspace-interface-operation">
<div class="interface-operation">
    <loader [display]="isLoading" [size]="'large'" [relative]="true"></loader>

    <sdc-button
        class="top-add-btn"
        [type]="'tertiary'"
        [icon_name]="'plus'"
        [icon_position]="'left'"
        [testId]="'add-operation'"
        [text]="'INTERFACE_ADD_OPERATION' | translate"
        [disabled]="readonly"
        (click)="onEditOperation()">
    </sdc-button>

    <div class="operation-list">

        <div
            class="empty-list-container"
            *ngIf="isListEmpty() && !isLoading">
            <div class="empty-list-message">{{ 'INTERFACE_DATA_EMPTY' | translate }}</div>
        </div>

        <div *ngIf="!isListEmpty()">

            <div class="expand-collapse">
                <button
                    type="button"
                    class="link"
                    data-tests-id="expand-all"
                    [ngClass]="{'disabled': isAllExpanded()}"
                    [disabled]="isAllExpanded()"
                    (click)="collapseAll(false)">
                    {{ 'INTERFACE_EXPAND_ALL' | translate }}
                </button> |
                <button
                    type="button"
                    class="link"
                    data-tests-id="collapse-all"
                    [ngClass]="{'disabled': isAllCollapsed()}"
                    [disabled]="isAllCollapsed()"
                    (click)="collapseAll()">
                    {{ 'INTERFACE_COLLAPSE_ALL' | translate }}
                </button>
            </div>

            <div
                class="interface-row"
                *ngFor="let interface of interfaces"
                [attr.data-tests-id]="'interface-' + interface.displayType()">

                <!-- Selenium matches @class='interface-accordion' exactly, so the row stays a div that toggles
                     for the mouse; the button around the name is the keyboard and AT control. -->
                <div
                    class="interface-accordion"
                    [attr.data-tests-id]="'interface-' + interface.displayType() + '-toggle'"
                    (click)="interface.toggleCollapse()">
                    <span
                        class="chevron-container"
                        [ngClass]="{'isCollapsed': interface.isCollapsed}">
                        <svg-icon
                            name="caret1-down-o"
                            mode="primary"
                            size="small">
                        </svg-icon>
                    </span>
                    <button type="button" [attr.aria-expanded]="!interface.isCollapsed"
                            (click)="$event.stopPropagation(); interface.toggleCollapse()"><span class="interface-name">{{interface.displayType()}}</span></button>
                </div>

                <div
                    class="generic-table"
                    *ngIf="!interface.isCollapsed">
                    <div class="header-row table-row">
                        <span
                            class="cell header-cell field-name header-name">
                            {{ 'INTERFACE_HEADER_NAME' | translate }}
                        </span>
                        <span
                            class="cell header-cell field-description header-description">
                            {{ 'INTERFACE_HEADER_DESCRIPTION' | translate }}
                        </span>
                        <span
                            class="cell header-cell field-actions header-actions">
                            ●●●
                        </span>
                    </div>

                    <!-- The row opens the operation for the mouse; the name button is the keyboard and AT control. -->
                    <div
                        class="data-row"
                        *ngFor="let operation of interface.operations"
                        [attr.data-tests-id]="'operation-' + operation.name"
                        (click)="onEditOperation(operation)">
                        <span
                            class="cell field-name"
                            [attr.data-tests-id]="'operation-' + operation.name + '-name'"><button
                                type="button"
                                class="field-name-button"
                                (click)="$event.stopPropagation(); onEditOperation(operation)">
                            {{operation.name}}
                        </button></span>
                        <span
                            class="cell field-description"
                            [ngClass]="{'collapsed': operation.isCollapsed}"
                            [attr.data-tests-id]="'operation-' + operation.name + '-description'">
                            {{operation.getDescriptionEllipsis()}}
                            <button
                                type="button"
                                class="more-or-less link"
                                *ngIf="operation.isEllipsis"
                                [attr.aria-expanded]="!operation.isCollapsed"
                                (click)="operation.toggleCollapsed($event)"
                                [attr.data-tests-id]="'operation-' + operation.name + '-ellipsis'">
                                {{operation.isCollapsed ? 'More' : 'Less'}}
                            </button>
                        </span>
                        <span class="cell field-actions">
                            <span
                                class="delete-action"
                                [attr.data-tests-id]="'remove-operation-' + operation.name">
                                <svg-icon
                                    *ngIf="!readonly"
                                    (click)="onRemoveOperation($event, operation)"
                                    name="trash-o"
                                    mode="info"
                                    size="small"
                                    [clickable]="true"
                                    ariaLabel="Delete {{operation.name}}">
                                </svg-icon>
                            </span>
                        </span>
                    </div>

                </div>
            </div>
        </div>

    </div>

</div>
</div>
