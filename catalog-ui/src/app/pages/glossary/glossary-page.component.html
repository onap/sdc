<div class="sdc-glossary-page">
    <top-nav [topLvlSelectedIndex]="-1" [version]="version" [hideSearch]="true"></top-nav>
    <main id="main-content" class="w-sdc-main-container sdc-glossary-main" data-tests-id="glossary-page">
        <h1 class="sdc-glossary-title">Glossary</h1>
        <input type="text" class="sdc-glossary-filter" placeholder="Filter"
               aria-label="Filter glossary" data-tests-id="glossary-filter"
               [(ngModel)]="filterText"/>
        <dl class="sdc-glossary-list">
            <div *ngFor="let entry of visibleEntries" class="sdc-glossary-row" [attr.data-tests-id]="'glossary-term-' + entry.key">
                <dt><span class="sdc-glossary-abbr" *ngIf="entry.abbr">{{entry.abbr + ' '}}</span>{{entry.name}}</dt>
                <dd>{{entry.description}}</dd>
            </div>
        </dl>
        <p *ngIf="!visibleEntries.length" class="sdc-glossary-empty">No matching terms.</p>
    </main>
</div>
