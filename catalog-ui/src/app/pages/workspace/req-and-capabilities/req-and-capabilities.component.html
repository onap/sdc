<div class="workspace-req-and-cap">
    <div class="req-and-cap-controls">
        <span class="req-and-cap-filter" *ngIf="notEmptyTable">
            <sdc-filter-bar
                [placeHolder]="'Search'"
                (keyup)="updateFilter($event)"
                [testId]="'search-box'">
            </sdc-filter-bar>
        </span>
        <sdc-button *ngIf="selectTabName === 'REQUIREMENTS' && showAdd()" class="req-and-cap-add" [type]="'tertiary'" [icon_name]="'plus'"
                    [icon_position]="'left'" [testId]="'add-requirement-button'" [text]="'Add Requirement'" (click)="addRequirement()"></sdc-button>
        <sdc-button *ngIf="selectTabName !== 'REQUIREMENTS' && showAdd()" class="req-and-cap-add" [type]="'tertiary'" [icon_name]="'plus'"
                    [icon_position]="'left'" [testId]="'add-capability-button'" [text]="'Add Capability'" (click)="addCapability()"></sdc-button>
    </div>
    <sdc-tabs (selectedTab)="selectTab($event)" [tabStyle]="'sdc-table-tab'">
        <sdc-tab [title]="'Requirements('+(requirements.length||'0')+')'" [active]="true" [testId]="'req-tab'">
            <div #requirementsContainer></div>
        </sdc-tab>
        <sdc-tab [title]="'Capabilities('+(capabilities.length||'0')+')'" [active]="false" [testId]="'cap-tab'">
            <div #capabilitiesContainer></div>      
        </sdc-tab>
    </sdc-tabs>
</div>
