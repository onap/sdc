<div class="sdc-workspace-container">
    <!-- Inline loader markup mirrors the old AngularJS <loader> directive (tlv-loader +
         data-tests-id="loader") so Selenium's LoaderHelper.waitForLoader() reliably catches it.
         <sdc-loader>'s service-driven activation did not render a Selenium-visible element. -->
    <div *ngIf="isLoading" data-tests-id="loader" class="sdc-loader-global-wrapper sdc-loader-background">
        <div class="tlv-loader-back"></div>
        <div class="tlv-loader large"></div>
    </div>
    <main id="main-content" class="w-sdc-main-container">
        <div class="w-sdc-left-sidebar" *ngIf="component && !isComposition">
            <h1 class="menu-header" [title]="menuComponentTitle">
                {{menuComponentTitle}}
            </h1>
            <nav aria-label="Workspace">
                <div class="i-sdc-designer-sidebar-section-content-item"
                     [class.selected]="isSelected(menuItem)"
                     *ngFor="let menuItem of leftBarTabs?.menuItems; let i = index">
                    <div class="expand-collapse-menu-box-item-text" [class.disabled]="menuItem.isDisabled">
                        <button [attr.data-tests-id]="menuItem.text + 'LeftSideMenu'"
                                type="button"
                                class="i-sdc-designer-sidebar-section-content-item-service-cat"
                                (click)="menuItem.callback()"
                                [disabled]="menuItem.isDisabled || menuItem.disabledCategory">{{menuItem.text}}</button>
                    </div>
                </div>
            </nav>
        </div>
        <h1 class="sr-only" *ngIf="component && isComposition">{{menuComponentTitle}}</h1>

        <!-- The class attribute MUST stay EXACTLY "w-sdc-main-right-container": Selenium page objects
             (AttributesPage/ToscaArtifactsPage.isLoaded) wait on the EXACT-class xpath
             //div[@class='w-sdc-main-right-container'] (not contains()). So this div carries NO
             structural *ngIf (which would remove it during an OnPush re-render and time out the wait)
             and NO [class.composition]/[class.deployment] bindings (which would pollute the class to
             "w-sdc-main-right-container composition" and break the exact match). The old AngularJS shell
             kept this div always-present with a clean class too; the composition/deployment layout is
             driven by the <body> bodyClass ancestor in workspace.less, not by a class on this div.
             The chrome content is guarded on `component` via the inner wrapper below. -->
        <div class="w-sdc-main-right-container">
          <!-- The chrome content is guarded on `component` via this wrapper <div>, NOT via a structural
               *ngIf on .w-sdc-main-right-container or .sdc-workspace-top-bar themselves. Angular adds the
               'ng-star-inserted' class to the ELEMENT that hosts a structural directive (and to the root
               nodes of an <ng-container *ngIf>), which would pollute those two divs' class attributes and
               break the e2e EXACT-class waits //div[@class='w-sdc-main-right-container'] and
               //div[@class='sdc-workspace-top-bar'] (NoSuchElementException -> 20s/5s timeout). The marker
               lands harmlessly on this wrapper instead. 'display:contents' keeps it layout-neutral so the
               workspace.less '> div:first-child' rules and absolute positioning are unaffected. -->
          <div class="w-sdc-main-right-container-content" *ngIf="component">
            <div *ngIf="isCreateProgress" data-tests-id="loader" class="sdc-loader-global-wrapper sdc-loader-background">
                <div class="tlv-loader-back"></div>
                <div class="tlv-loader large"></div>
            </div>
            <div class="sdc-workspace-top-bar">
                <div class="version-container">
                    <span *ngIf="!isCreateMode() && !component.isLatestVersion()" class="not-latest"></span>
                    <select *ngIf="!isCreateMode()"
                            class="version-selector"
                            data-tests-id="versionHeader"
                            aria-label="Version"
                            [(ngModel)]="changeVersion.selectedVersion"
                            [class.disabled]="unsavedChanges"
                            (change)="onVersionChanged(changeVersion.selectedVersion.versionId)">
                        <option *ngFor="let ver of versionsList" [ngValue]="ver">V{{ver.versionNumber}}</option>
                    </select>
                </div>
                <div class="lifecycle-state">
                    <div *ngIf="showLifecycleIcon()"
                         class="lifecycle-state-icon"
                         [ngClass]="isCreateMode() ? 'in-design-status-icon' : sdcMenu?.LifeCycleStatuses[component.lifecycleState]?.icon">
                    </div>
                    <span class="lifecycle-state-text" data-tests-id="formlifecyclestate">{{getStatus()}}</span>
                </div>
                <div class="archive-state-label" *ngIf="component.isArchived">
                    <div class="sprite-new archive-label"></div>
                </div>
                <div class="progress-container">
                    <workspace-top-progress class="general-view-top-progress"
                                            [progressValue]="progressValue"
                                            [progressMessage]="progressMessage"></workspace-top-progress>
                </div>
                <div class="sdc-workspace-top-bar-buttons">
                    <span *ngIf="!isCreateMode() && !component.isLatestVersion() && !showLatestVersion()" [class.disabled]="unsavedChanges">
                        Switch to the&nbsp;<button type="button" class="latest-version-link" data-tests-id="latest-version" [disabled]="unsavedChanges" (click)="getLatestVersion()">latest version</button>
                    </span>
                    <button *ngIf="showUpgradeServicesButton()"
                            (click)="openAutomatedUpgradeModal()"
                            [disabled]="hasNoDependencies"
                            [class.disabled]="component.isArchived"
                            class="tlv-btn blue"
                            data-tests-id="open-upgrade-vsp-popup">{{component.isResource() ? 'Upgrade Services' : 'Update Services'}}</button>
                    <ng-container *ngIf="changeLifecycleStateButtons">
                        <button *ngFor="let entry of lifecycleButtonEntries; trackBy: trackByKey; let first = first"
                                (click)="changeLifecycleState(entry.key)"
                                [disabled]="checkDisableButton(entry.value)"
                                class="change-lifecycle-state-btn tlv-btn"
                                [ngClass]="first ? 'outline green' : 'grey'"
                                [attr.data-tests-id]="testsId(entry.value.text)">
                            {{entry.value.text}}
                        </button>
                    </ng-container>
                    <button *ngIf="showRestoreButton()"
                            (click)="restoreComponent()"
                            [class.disabled]="!isDesigner() || !component.isLatestVersion()"
                            class="tlv-btn blue"
                            data-tests-id="restore-component-button">Restore</button>
                    <button *ngIf="!isViewMode() && isCreateMode()"
                            (click)="create()"
                            [disabled]="!isValidForm || isDisableMode() || isLoading || unsavedChanges"
                            class="tlv-btn outline green"
                            data-tests-id="create/save">Create</button>
                    <!-- The sprite buttons below carry the label text the AngularJS original had, kept
                         because `.sdc-workspace-top-bar-buttons > .sprite-new` text-indents it out of
                         the 24px box (workspace.less). `sdc-smart-tooltip` from the deleted AngularJS
                         directives is substituted by the shipped library's [sdc-tooltip]; the deleted
                         `prevent-double-click` directive has no replacement and no remaining users. -->
                    <button type="button" *ngIf="showDeleteVersionButton()"
                            (click)="changeLifecycleState('deleteVersion')"
                            [disabled]="!isValidForm || isDisableMode() || isViewMode() || unsavedChanges"
                            [class.disabled]="!isValidForm || isDisableMode() || isViewMode() || unsavedChanges"
                            class="sprite-new delete-btn"
                            data-tests-id="delete_version"
                            sdc-tooltip [tooltip-text]="'Delete'">Delete</button>
                    <button type="button" *ngIf="showDeleteArchivedButton()"
                            aria-label="Delete component"
                            (click)="deleteArchivedComponent()"
                            class="sprite-new delete-btn"
                            data-tests-id="delete_archive_version"
                            sdc-tooltip [tooltip-text]="'Delete Component'">Delete</button>
                    <button type="button" *ngIf="showArchiveButton()"
                            (click)="archiveComponent()"
                            [disabled]="!component.isLatestVersion()"
                            [class.disabled]="!component.isLatestVersion()"
                            class="sprite-new archive-btn"
                            data-tests-id="archive-component-button"
                            sdc-tooltip [tooltip-text]="'Archive'">Archive</button>
                    <span class="delimiter"></span>
                    <button type="button" class="sprite-new x-btn" [disabled]="unsavedChanges" (click)="goToBreadcrumbHome()" [class.disabled]="unsavedChanges">Close</button>
                </div>
            </div>
            <div class="w-sdc-main-container-body-content-header" *ngIf="!isComposition && !isDeployment && !isPlugins">
                <h2 class="workspace-tab-title">
                    {{getTabTitle()}}
                </h2>
            </div>
            <router-outlet></router-outlet>
          </div>
        </div>
    </main>
    <top-nav *ngIf="component" [hideSearch]="true" [menuModel]="breadcrumbsModel" [version]="version" [unsavedChanges]="unsavedChanges" [unsavedChangesCallback]="unsavedChangesCallback"></top-nav>
</div>
