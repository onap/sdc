<div class="category-management">

    <div *ngIf="isLoading" data-tests-id="loader" class="sdc-loader-global-wrapper sdc-loader-background">
        <div class="tlv-loader-back"></div>
        <div class="tlv-loader large"></div>
    </div>

    <div class="row">

        <div class="col-sm-6">
            <h2>
                <button type="button" class="hand"
                      (click)="selectType(SERVICE)"
                      [ngClass]="{'selected': type === SERVICE}"
                      [attr.aria-pressed]="type === SERVICE"
                      data-tests-id="servicecategoryheader">{{'SERVICE_CATEGORY_HEADER' | translate}}</button>
                <button type="button" class="hand"
                      (click)="selectType(RESOURCE)"
                      [ngClass]="{'selected': type === RESOURCE}"
                      [attr.aria-pressed]="type === RESOURCE"
                      data-tests-id="resourcecategoryheader">{{'RESOURCE_CATEGORY_HEADER' | translate}}</button>
            </h2>
            <button type="button" (click)="createCategoryModal(null)"
                  data-tests-id="newcategory">{{'ADD_CATEGORY' | translate}}</button>

            <div class="scrollbar-container" style="overflow-y:auto">
                <ul>
                    <li *ngFor="let category of categoriesToShow"
                        [ngClass]="{'selected': selectedCategory === category, 'gray': selectedSubCategory}">
                        <button type="button" (click)="selectCategory(category)"
                                [attr.aria-pressed]="selectedCategory === category"
                                [attr.data-tests-id]="type === SERVICE ? 'servicecategory' : 'resourcecategory'">
                            {{category.name}}
                        </button>
                    </li>
                </ul>
            </div>
        </div>

        <div class="col-sm-6">
            <h2>
                <span data-tests-id="subcategoryheader">{{'SUBCATEGORY_HEADER' | translate}}</span>
            </h2>
            <button type="button" *ngIf="type === RESOURCE && selectedCategory"
                  (click)="createCategoryModal(selectedCategory)"
                  data-tests-id="newsubcategory">{{'ADD_SUBCATEGORY' | translate}}</button>

            <div class="scrollbar-container" style="overflow-y:auto">
                <ul>
                    <li *ngFor="let subcategory of selectedCategory?.subcategories"
                        [ngClass]="{'selected': selectedSubCategory === subcategory}">
                        <button type="button" (click)="selectSubCategory(subcategory)"
                                [attr.aria-pressed]="selectedSubCategory === subcategory"
                                data-tests-id="subcategory">
                            {{subcategory.name}}
                        </button>
                    </li>
                </ul>
            </div>
        </div>

    </div>
</div>
