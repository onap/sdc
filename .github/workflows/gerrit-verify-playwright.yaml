---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 Deutsche Telekom AG

name: "Gerrit Verify (Playwright UI)"

# Runs the Playwright end-to-end suite in integration-tests/playwright-tests against the
# full integration-test Docker stack (Cassandra, backend, onboarding backend, frontend,
# webseal-simulator).
#
# This job is ADDITIVE to the Jenkins CSIT jobs in ci-management/jjb/sdc/sdc-csit.yaml
# ('ui' = TestNG/Selenium, 'api' = TestNG backend). It replaces neither.
#
# VOTING: the vote job casts Verified+1 / Verified-1, so a red run blocks submission. A flaky
# -1 is cleared by commenting 'recheck' on the change, which re-dispatches this workflow.

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:
        description: "Branch that change is against"
        required: false
        type: string
      GERRIT_CHANGE_ID:
        description: "The ID for the change"
        required: false
        type: string
      GERRIT_CHANGE_NUMBER:
        description: "The Gerrit number"
        required: false
        type: string
      GERRIT_CHANGE_URL:
        description: "URL to the change"
        required: false
        type: string
      GERRIT_EVENT_TYPE:
        description: "Type of Gerrit event"
        required: false
        type: string
      GERRIT_PATCHSET_NUMBER:
        description: "The patch number for the change"
        required: false
        type: string
      GERRIT_PATCHSET_REVISION:
        description: "The revision sha"
        required: false
        type: string
      GERRIT_PROJECT:
        description: "Project in Gerrit"
        required: false
        type: string
      GERRIT_REFSPEC:
        description: "Gerrit refspec of change"
        required: false
        type: string
      GERRIT_DISABLED:
        description: "Run without Gerrit components"
        required: false
        default: false
        type: boolean

# Default to no permissions; jobs grant only what they need.
permissions: {}

concurrency:
  # yamllint disable-line rule:line-length
  group: "gerrit-verify-playwright-${{ github.workflow }}-${{ github.event.inputs.GERRIT_CHANGE_ID || github.run_id }}"
  cancel-in-progress: true

env:
  # SDC is Java 11 source/target — do NOT raise this to match other ONAP repos on 17.
  JAVA_VERSION: "11"
  JAVA_DISTRIBUTION: "temurin"
  NODE_VERSION: "18"
  NPM_REGISTRY: "https://nexus3.onap.org/repository/npm.public/npm/-/"

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' && inputs.GERRIT_DISABLED != true
    runs-on: ubuntu-latest
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Notify job start
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@a5de1d5bf17c2603ae81544dc2a455017b454ec8 # v1.1.1
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          # Now that the job votes, 'clear' has to zero its own previous Verified vote —
          # with comment-only that vote would stand until the new run finished.
          vote-type: clear

      - name: Allow replication
        run: sleep 10s

  playwright:
    name: "Playwright UI tests"
    needs: [notify]
    # Runs even when 'notify' is skipped (GERRIT_DISABLED / non-dispatch triggers).
    if: always()
    runs-on: ubuntu-latest
    # Matches the Jenkins CSIT build-timeout of 120 minutes. A cold run is dominated by the
    # image build (~15 min) and the backend importing ~97 normative types (~5 min).
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      # A GitHub-hosted runner ships ~14 GB free on /, while the SDC stack needs ~6 GB of
      # images plus the Maven build tree. Reclaiming the preinstalled toolchains we do not
      # use buys ~30 GB and is the difference between this job running and dying mid-build
      # with a confusing ENOSPC. Jenkins runs this on an 8c-8g node that needs no such help.
      - name: Free up disk space
        run: |
          echo "Available before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/.ghcup \
                      /usr/local/share/powershell \
                      /usr/share/swift \
                      /usr/local/lib/node_modules \
                      "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          echo "Available after cleanup:"
          df -h /

      # Standard checkout for manual runs without a Gerrit context.
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        if: github.event_name != 'workflow_dispatch' || inputs.GERRIT_DISABLED == true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout Gerrit change
        # yamllint disable-line rule:line-length
        if: github.event_name == 'workflow_dispatch' && inputs.GERRIT_DISABLED != true
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@8523d768952d9690702b4696a8310d2a84b1be39 # v1.0.1
        with:
          gerrit-refspec: ${{ inputs.GERRIT_REFSPEC }}
          gerrit-project: ${{ inputs.GERRIT_PROJECT }}
          gerrit-url: ${{ vars.GERRIT_URL }}
          delay: "0s"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        # yamllint disable-line rule:line-length
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Set up Node ${{ env.NODE_VERSION }}
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # SDC resolves artifacts from ONAP Nexus, which needs an oparent-style settings.xml.
      # Only public read access is required here — nothing is published — so the anonymous
      # mirror/repository definitions suffice and no Nexus credentials are involved.
      - name: Generate Maven settings.xml
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" << 'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>onap-public</id>
                <mirrorOf>external:*,!snapshots</mirrorOf>
                <url>https://nexus.onap.org/content/groups/public/</url>
              </mirror>
            </mirrors>
            <profiles>
              <profile>
                <id>onap-settings</id>
                <properties>
                  <onap.nexus.url>https://nexus.onap.org</onap.nexus.url>
                  <docker.pull.registry>nexus3.onap.org:10001</docker.pull.registry>
                  <docker.push.registry>nexus3.onap.org:10003</docker.push.registry>
                </properties>
              </profile>
              <profile>
                <id>onap-nexus</id>
                <repositories>
                  <repository>
                    <id>onap-public</id>
                    <url>https://nexus.onap.org/content/groups/public/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                  <repository>
                    <id>onap-snapshots</id>
                    <url>https://nexus.onap.org/content/repositories/snapshots/</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>onap-public</id>
                    <url>https://nexus.onap.org/content/groups/public/</url>
                    <releases>
                      <enabled>true</enabled>
                      <updatePolicy>never</updatePolicy>
                    </releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>onap-settings</activeProfile>
              <activeProfile>onap-nexus</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      # Two non-obvious requirements, both load-bearing:
      #   'clean' is MANDATORY, not hygiene — build-helper's parse-version goal is bound to
      #   pre-clean, and without it the ${parsedVersion.*} variables in the Docker image tags
      #   do not resolve.
      #   'all' is named explicitly because Maven drops an activeByDefault profile as soon as
      #   another profile from the SAME pom is activated. Harmless today ('docker' is declared
      #   per-module, so 'all' survives on its own) but it makes the module list independent of
      #   that detail. Do NOT substitute fast-build here: its module list omits
      #   integration-tests, which this job's second command builds against.
      # Unit tests are covered by the separate Jenkins verify job; skipping them here avoids
      # paying for them twice.
      - name: Build SDC and Docker images
        run: |
          mvn clean install \
            -P all,docker \
            -DskipTests \
            -Djacoco.skip=true \
            -DskipPMD \
            -Dmaven.javadoc.skip=true \
            -DskipYamlJsonValidator=true \
            -Ddocker.skip.push=true \
            -Dnpm.registry=${NPM_REGISTRY} \
            -Dmaven.repo.local=/tmp/r \
            --batch-mode --no-transfer-progress

      - name: Report disk usage after build
        if: always()
        run: |
          df -h /
          docker images --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | grep sdc || true

      # Starts the stack, installs Node/npm + Chromium, runs the suite, tears the stack down.
      # The Selenium grid container is skipped via it.selenium.disabled in this profile.
      - name: Run Playwright integration tests
        run: |
          mvn verify \
            -P run-integration-tests-playwright \
            -f integration-tests/pom.xml \
            -Ddocker.skip.push=true \
            -Dnpm.registry=${NPM_REGISTRY} \
            -Dmaven.repo.local=/tmp/r \
            --batch-mode --no-transfer-progress

      # A stack that never became healthy is the most common failure mode and is invisible
      # in the Playwright report, so capture container state separately.
      - name: Collect container diagnostics
        if: failure()
        run: |
          docker ps -a || true
          for c in $(docker ps -aq); do
            echo "::group::docker logs $(docker inspect --format '{{.Name}}' "$c")"
            docker logs --tail 200 "$c" 2>&1 || true
            echo "::endgroup::"
          done

      # playwright.config.ts sets trace: 'on' unconditionally, so every run leaves traces.
      # These are the primary debugging artifact — 'npx playwright show-trace <zip>'.
      - name: Upload Playwright report and traces
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: |
            integration-tests/target/playwright-report/
            integration-tests/target/playwright-results/
            integration-tests/target/playwright-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload container and Jetty logs
        if: failure()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-logs
          path: |
            **/*.log
            **/hs_err_*.log
          retention-days: 14
          if-no-files-found: ignore

  vote:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.GERRIT_DISABLED != true }}
    needs: [notify, playwright]
    runs-on: ubuntu-latest
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Get conclusion
        # yamllint disable-line rule:line-length
        uses: im-open/workflow-conclusion@7b146947e59eaf7fc3328822357861ab1758c088 # v2.2.5

      - name: Set vote
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@a5de1d5bf17c2603ae81544dc2a455017b454ec8 # v1.1.1
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          # comment-only is deliberately absent, so this defaults to false and the run votes:
          # Verified+1 on success, Verified-1 on failure, Verified-1 + Code-Review-1 on a
          # cancelled run. Set it back to true to make the job advisory again.
          vote-type: ${{ env.WORKFLOW_CONCLUSION }}
